<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeSpellBee - Student Login</title>
    <link rel="icon" href="https://lh3.googleusercontent.com/drive-viewer/AKGpihYranxMDZGIwq2vt9-ECjkRyV0Lg6GJpH9sjhXrAJUVu3dKqBnhz_kETqzLZ5ONyml33ggbUyahKJwJtjg0SAL8IrJ270-9PPM=s2560">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .login-container {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #00ffff;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
        }
        .login-container h1 {
            color: #00ffff;
            text-align: center;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .login-container p.sub {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #88dddd;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #111;
            border: 1px solid #2a4a4a;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.05);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #00ffff;
            color: #000;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #66ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            transform: scale(1.01);
        }
        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 0.9rem;
        }
        .signup-link a {
            color: #00ffff;
            text-decoration: none;
            font-weight: 600;
        }
        .signup-link a:hover {
            text-decoration: underline;
        }
        .error-msg {
            color: #ff6b6b;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        .success-msg {
            color: #00ff88;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #000;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1>📚 BeSpellBee</h1>
    <p class="sub">Welcome back! Log in to continue learning.</p>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="e.g. sarah@email.com" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Login</button>
    </form>

    <div id="errorMsg" class="error-msg"></div>
    <div id="successMsg" class="success-msg"></div>

    <div class="signup-link">
        Don't have an account? <a href="student-signup.html">Sign up here</a>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        
        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        
        if (!email || !password) {
            errorMsg.textContent = 'Please fill in all fields.';
            errorMsg.style.display = 'block';
            return;
        }
        
        submitBtn.innerHTML = '<span class="spinner"></span> Logging in...';
        submitBtn.classList.add('loading');

        try {
            const response = await fetch('https://bespellbee-backend-en6l.onrender.com/api/auth/student-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (data.success) {
                localStorage.setItem('studentToken', data.data.token);
                localStorage.setItem('studentId', data.data.id);
                localStorage.setItem('studentName', data.data.name);
                
                successMsg.textContent = '✅ Welcome back! Redirecting...';
                successMsg.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'student-dashboard.html';
                }, 1000);
            } else {
                errorMsg.textContent = data.message || 'Invalid email or password.';
                errorMsg.style.display = 'block';
                submitBtn.innerHTML = 'Login';
                submitBtn.classList.remove('loading');
            }
        } catch (error) {
            errorMsg.textContent = 'Network error. Please check your connection.';
            errorMsg.style.display = 'block';
            submitBtn.innerHTML = 'Login';
            submitBtn.classList.remove('loading');
        }
    });
</script>

</body>
</html>
