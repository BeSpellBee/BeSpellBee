<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schéma Interactif : Dara Kahrabayia (4.5V)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .circuit-container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #1a73e8; margin-top: 0; }
        
        /* Interactive Step Controls */
        .step-controls {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            gap: 10px;
        }
        .btn-step {
            flex: 1;
            background: #e8eaed;
            color: #3c4043;
            border: 2px solid #dadce0;
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .btn-step.active {
            background: #1a73e8;
            color: white;
            border-color: #1a73e8;
        }
        .btn-step:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .instruction-box {
            background: #e8f0fe;
            color: #1967d2;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 500;
            font-size: 14px;
        }

        .circuit-board {
            position: relative;
            height: 320px;
            background: #fafafa;
            border: 2px dashed #ccc;
            border-radius: 8px;
            margin: 20px 0;
            overflow: hidden;
        }
        /* Components styling */
        .component {
            position: absolute;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            z-index: 10;
        }
        .battery {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #34495e;
            color: white;
            width: 240px;
            height: 60px;
        }
        .terminal {
            position: absolute;
            top: -15px;
            width: 30px;
            height: 15px;
            background: #e67e22;
            color: black;
            font-size: 11px;
            line-height: 15px;
            border-radius: 3px 3px 0 0;
        }
        /* + terminal: green, longer, label ABOVE the icon */
        .term-pos {
            left: 25px;
            background: #27ae60;
            color: white;
            height: 26px;
            top: -26px;
            font-weight: bold;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            border-radius: 4px 4px 0 0;
            letter-spacing: 0.3px;
            border: 1px solid #1e8449;
        }
        /* - terminal: red, shorter, label ABOVE the icon */
        .term-neg {
            right: 25px;
            background: #e74c3c;
            color: white;
            height: 18px;
            top: -18px;
            font-weight: bold;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            border-radius: 3px 3px 0 0;
            letter-spacing: 0.3px;
            border: 1px solid #b03a2e;
        }
        
        /* Sombre (dark) interrupter */
        .switch-comp {
            top: 40px;
            left: 40px;
            background: #2c3e50;
            color: #ecf0f1;
            cursor: pointer;
            user-select: none;
            border: 2px solid #1a252f;
            transition: all 0.3s ease;
        }
        .switch-comp:hover {
            background: #3d566e;
        }
        
        .bulb-comp {
            top: 40px;
            right: 40px;
            background: #ecf0f1;
            color: #2c3e50;
            border: 2px solid #bdc3c7;
            transition: all 0.3s ease;
        }
        /* Enhanced glowing bulb */
        .bulb-comp.lit {
            background: radial-gradient(circle, #fff9c4 0%, #f1c40f 40%, #f39c12 80%, #e67e22 100%);
            box-shadow: 
                0 0 15px #f1c40f,
                0 0 35px #f39c12,
                0 0 60px rgba(243, 156, 18, 0.6),
                inset 0 0 12px rgba(255, 255, 200, 0.9);
            border-color: #f39c12;
            color: #7d6608;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
        }
        /* SVG Wires */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .wire {
            fill: none;
            stroke-width: 4;
            display: none;
        }
        .wire-step1 { stroke: #e74c3c; }
        .wire-step2 { stroke: #3498db; }
        .wire-step3 { stroke: #2c3e50; }
        
        .flow {
            stroke-dasharray: 8, 8;
            animation: dash 1s linear infinite;
            display: none;
        }
        @keyframes dash {
            to { stroke-dashoffset: -20; }
        }
        .btn-toggle {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .btn-toggle:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        .legend {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            margin-top: 15px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="circuit-container">
    <h2>دارة كهربائية بسيطة (4.5V)</h2>
    
    <!-- Assembly Progress Nav buttons -->
    <div class="step-controls">
        <button class="btn-step active" id="btn-1" onclick="triggerStep(1)">Étape 1 🔴</button>
        <button class="btn-step" id="btn-2" onclick="triggerStep(2)" disabled>Étape 2 🔵</button>
        <button class="btn-step" id="btn-3" onclick="triggerStep(3)" disabled>Étape 3 ⚫</button>
    </div>

    <div class="instruction-box" id="info-msg">
        🔴 Étape 1 : Reliez la borne (+) de la pile à l'interrupteur.
    </div>
    
    <div class="circuit-board">
        <svg id="circuit-svg">
            <!-- Step 1 Wire: Pos Terminal (195, 215) to Switch (95, 80) -->
            <path id="wire1" class="wire wire-step1" d="M 195 215 L 195 140 L 95 140 L 95 80" />
            <path id="flow1" class="wire wire-step1 flow" d="M 195 215 L 195 140 L 95 140 L 95 80" />
            
            <!-- Step 2 Wire: Switch (145, 80) to Bulb (445, 80) -->
            <path id="wire2" class="wire wire-step2" d="M 145 80 L 290 80 L 445 80" />
            <path id="flow2" class="wire wire-step2 flow" d="M 145 80 L 290 80 L 445 80" />
            
            <!-- Step 3 Wire: Bulb (475, 80) to Neg Terminal (395, 225) -->
            <path id="wire3" class="wire wire-step3" d="M 475 80 L 475 140 L 395 140 L 395 225" />
            <path id="flow3" class="wire wire-step3 flow" d="M 475 80 L 475 140 L 395 140 L 395 225" />
        </svg>

        <!-- Interrupter (somber / dark) -->
        <div class="component switch-comp" id="switchDevice" onclick="toggleCircuit()">
            Interrupteur (القاطع)<br><span id="switch-status">OUVERT (OFF)</span>
        </div>

        <!-- Bulb/Socket -->
        <div class="component bulb-comp" id="bulbDevice">
            Douille & Ampoule<br>(حامل المصباح)
        </div>

        <!-- Battery: + (green) and - (red) labels ABOVE the icons -->
        <div class="component battery">
            <div class="terminal term-pos" title="Borne positive (longue)">+ Longue</div>
            <div class="terminal term-neg" title="Borne négative (courte)">– Courte</div>
            Pile Plate / البطارية (4.5V)
        </div>
    </div>

    <button class="btn-toggle" id="main-switch-btn" onclick="toggleCircuit()" disabled>Actionner l'interrupteur</button>

    <div class="legend">
        <div>🔴 <span style="color:#e74c3c;font-weight:bold">Fil Rouge</span> : Étape 1 (+)</div>
        <div>🔵 <span style="color:#3498db;font-weight:bold">Fil Bleu</span> : Étape 2</div>
        <div>⚫ <span style="color:#2c3e50;font-weight:bold">Fil Noir</span> : Étape 3 (-)</div>
    </div>
</div>

<script>
    let isClosed = false;
    let currentStep = 1;
    let s1Done = false, s2Done = false, s3Done = false;

    const notes = {
        1: "🔴 Étape 1 : Reliez la grande lamelle (+) de la pile à l'interrupteur.",
        2: "🔵 Étape 2 : Connectez l'autre vis de l'interrupteur au support de l'ampoule.",
        3: "⚫ Étape 3 : Fermez la boucle en reliant la douille à la petite lamelle (-) de la pile."
    };

    function triggerStep(step) {
        if (step === 1) {
            document.getElementById('wire1').style.display = 'block';
            s1Done = true;
            document.getElementById('btn-2').disabled = false;
            moveUi(2);
        } else if (step === 2 && s1Done) {
            document.getElementById('wire2').style.display = 'block';
            s2Done = true;
            document.getElementById('btn-3').disabled = false;
            moveUi(3);
        } else if (step === 3 && s2Done) {
            document.getElementById('wire3').style.display = 'block';
            s3Done = true;
            document.getElementById('main-switch-btn').disabled = false;
            document.getElementById('info-msg').innerHTML = "🎉 Montage terminé ! Vous pouvez maintenant actionner l'interrupteur.";
            document.getElementById('btn-1').classList.remove('active');
            document.getElementById('btn-2').classList.remove('active');
            document.getElementById('btn-3').classList.add('active');
        }
    }

    function moveUi(next) {
        document.getElementById('info-msg').innerText = notes[next];
        document.getElementById('btn-1').classList.remove('active');
        document.getElementById('btn-2').classList.remove('active');
        document.getElementById('btn-3').classList.remove('active');
        document.getElementById('btn-' + (next - 1)).classList.add('active');
    }

    function toggleCircuit() {
        if (!s3Done) return;
        
        isClosed = !isClosed;
        const bulb = document.getElementById('bulbDevice');
        const statusText = document.getElementById('switch-status');
        const flows = [
            document.getElementById('flow1'), 
            document.getElementById('flow2'), 
            document.getElementById('flow3')
        ];
        
        if (isClosed) {
            bulb.classList.add('lit');
            statusText.innerText = "FERMÉ (ON)";
            statusText.style.color = "#27ae60";
            flows.forEach(f => f.style.display = 'block');
            document.getElementById('info-msg').innerText = "💡 Circuit FERMÉ (دارة مغلقة) : L'ampoule brille !";
        } else {
            bulb.classList.remove('lit');
            statusText.innerText = "OUVERT (OFF)";
            statusText.style.color = "#2c3e50";
            flows.forEach(f => f.style.display = 'none');
            document.getElementById('info-msg').innerText = "🛑 Circuit OUVERT (دارة مفتوحة) : Le courant ne passe plus.";
        }
    }
</script>

</body>
</html>
