    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h2 id="modalTitle">Add Module</h2>
            <p class="sub" id="modalSub">Create a new module for your course.</p>
            <form id="modalForm" novalidate>

                <div class="form-group" id="lessonTypeGroup" style="display:none;">
                    <label for="lessonType">Lesson Type</label>
                    <select id="lessonType">
                        <option value="lesson">📖 Lesson</option>
                        <option value="quiz">🧠 Quiz</option>
                    </select>
                </div>

                <div class="form-group" id="lessonContentGroup" style="display:none;">
                    <label for="lessonContent">Content (HTML / iframe embed)</label>
                    <textarea id="lessonContent" placeholder="Paste your lesson content, iframe embed code, or HTML here..."></textarea>
                </div>

                <div class="form-group" id="quizQuestionsGroup" style="display:none;">
                    <label>Quiz Questions</label>
                    <div id="quizQuestionsContainer">
                        <!-- ... same as before ... -->

                    <button type="button" onclick="addQuestionField()">+ Add Question</button>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn-primary" id="modalSubmitBtn">Save</button>
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="button" class="btn-danger" id="modalDeleteBtn" style="display:none;" onclick="confirmDelete()">🗑️ Delete</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // The rest of your JavaScript – but modify the module creation:
        // ============================================================

        // When adding a module, automatically create 3 placeholder lessons
        async function createModuleWithPlaceholders(courseId, title) {
            // First create the module
            const module = await createModule(courseId, title);
            if (!module) return null;

            // Define three placeholder lessons
            const placeholders = [
                {
                    title: '📖 Lesson',
                    type: 'lesson',
                    content: '<p><strong>Lesson content goes here.</strong></p><p>Add your presentation, text, or embed a video.</p>',
                    orderIndex: 0
                },
                {
                    title: '✍️ Practice Activity',
                    type: 'lesson',
                    content: '<p><strong>Practice activity goes here.</strong></p><p>Add exercises, Lumi iframe, or a task for students.</p>',
                    orderIndex: 1
                },
                {
                    title: '🧠 Quiz',
                    type: 'quiz',
                    questions: [
                        { question: 'Question 1?', options: ['Option A', 'Option B', 'Option C'], correct: 0 },
                        { question: 'Question 2?', options: ['Option A', 'Option B', 'Option C'], correct: 1 }
                    ],
                    orderIndex: 2
                }
            ];

            // Create each placeholder lesson
            let allSuccess = true;
            for (const data of placeholders) {
                const result = await createLesson(module.id, data);
                if (!result) {
                    allSuccess = false;
                    alert('Failed to create one of the placeholder lessons.');
                    break;
                }
            }
            return allSuccess ? module : null;
        }

        // ============================================================
        // Update the modal submit handler to use the new function
        // ============================================================
        document.getElementById('modalForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!currentCourseId) {
                alert('Please select a course first.');
                return;
            }

            const type = document.getElementById('modalType').value;
            const submitBtn = document.getElementById('modalSubmitBtn');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Saving...';

            try {
                if (type === 'module') {
                    const moduleId = document.getElementById('editModuleId').value;
                    const title = document.getElementById('moduleName').value.trim();
                    if (!title) { alert('Module title is required.'); return; }

                    let result;
                    if (moduleId) {
                        // Editing existing module – just update title
                        result = await updateModule(parseInt(moduleId), title);
                    } else {
                        // New module – create with placeholders
                        result = await createModuleWithPlaceholders(currentCourseId, title);
                    }
                    if (result) {
                        closeModal();
                        await selectCourse(currentCourseId);
                    }
                } else if (type === 'lesson') {
                    // ... (lesson creation stays the same)
                }
            } catch (error) {
                console.error(error);
                alert('An error occurred.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        // ============================================================
        // Move lesson (up/down) – same as before
        // ============================================================

        }
