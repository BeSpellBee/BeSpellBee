<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeSpellBee - Teacher Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
        }
        .nav-bar {
            background: #0d0d0d;
            border-bottom: 1px solid #1a4a4a;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid #1a4a4a;
            padding-bottom: 16px;
        }
        .page-header h1 { color: #00ffff; }
        .student-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .student-card {
            background: #121212;
            border: 1px solid #1a4a4a;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
        }
        .student-card:hover { border-color: #00ffff; }
        .student-card .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a4a4a;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .student-card .header .name { color: #00ffff; font-weight: 700; font-size: 1.1rem; }
        .student-card .header .score {
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .score.high { background: rgba(0, 255, 136, 0.15); color: #00ff88; }
        .score.medium { background: rgba(255, 204, 0, 0.15); color: #ffcc00; }
        .score.low { background: rgba(255, 68, 68, 0.15); color: #ff6666; }

        .performance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .performance-category {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 10px 12px;
        }
        .performance-category .cat-label {
            font-size: 0.65rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .performance-category .cat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }
        .performance-category .cat-detail {
            font-size: 0.7rem;
            color: #888;
            margin-top: 2px;
        }
        .performance-category .cat-bar {
            height: 3px;
            background: #2a2a2a;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .performance-category .cat-bar .fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.8s ease;
        }
        .fill.green { background: #00ff88; }
        .fill.cyan { background: #00ffff; }
        .fill.yellow { background: #ffcc00; }
        .fill.orange { background: #ff9944; }
        .fill.red { background: #ff6666; }

        .oral-section {
            margin-top: 12px;
            padding: 12px;
            background: #1a1a1a;
            border-radius: 8px;
            border-left: 4px solid #ffcc00;
        }
        .oral-section .oral-label {
            font-size: 0.7rem;
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .oral-section .oral-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .oral-section .oral-stats .stat {
            font-size: 0.75rem;
            color: #888;
        }
        .oral-section .oral-stats .stat .val {
            font-weight: 700;
            color: #fff;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.online { background: #00ff88; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .radio-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .radio-btn {
            padding: 8px 20px;
            background: #0d0d0d;
            border: 1px solid #1a4a4a;
            border-radius: 40px;
            color: #88dddd;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
        }
        .radio-btn:hover { border-color: #00ffff; color: #00ffff; }
        .radio-btn.active {
            background: #00ffff;
            color: #000;
            border-color: #00ffff;
        }

        @media (max-width: 700px) {
            .student-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="logo">BeSpellBee</div>
        <div class="teacher-info">
            <span class="name" id="teacherName"><i class="fas fa-user-graduate"></i> Loading...</span>
            <a href="teacher-dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-chart-pie"></i> Student Performance by Level</h1>
            <div class="radio-group">
                <button class="radio-btn active" onclick="filterStudents('all')">All</button>
                <button class="radio-btn" onclick="filterStudents('high')">🌟 High</button>
                <button class="radio-btn" onclick="filterStudents('medium')">🔥 Medium</button>
                <button class="radio-btn" onclick="filterStudents('low')">🌱 Low</button>
            </div>
        </div>

        <div id="studentsContainer" class="student-grid">
            <div style="grid-column:1/-1; text-align:center; padding:40px; color:#666;">
                <i class="fas fa-spinner fa-spin" style="font-size:2rem; color:#00ffff;"></i>
                <p style="margin-top:10px;">Loading student data...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://bespellbee-backend-en6l.onrender.com';
        const token = localStorage.getItem('authToken');
        let allStudents = [];
        let filter = 'all';

        async function fetchStudents() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/track/teacher/engagement`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                if (data.success) {
                    allStudents = data.data.students || [];
                    renderStudents();
                }
            } catch (error) {
                console.error('Error fetching students:', error);
            }
        }

        function filterStudents(filterType) {
            filter = filterType;
            document.querySelectorAll('.radio-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase().includes(filterType) || filterType === 'all');
            });
            renderStudents();
        }

        function getScoreLevel(score) {
            if (score >= 70) return 'high';
            if (score >= 40) return 'medium';
            return 'low';
        }

        function getLevelLabel(level) {
            const labels = { high: '🌟 High', medium: '🔥 Medium', low: '🌱 Low' };
            return labels[level] || level;
        }

        function renderStudents() {
            const container = document.getElementById('studentsContainer');
            const filtered = filter === 'all' 
                ? allStudents 
                : allStudents.filter(s => getScoreLevel(parseFloat(s.engagementScore)) === filter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:40px; color:#666;">
                        <i class="fas fa-users" style="font-size:2rem; display:block; margin-bottom:10px;"></i>
                        No students found.
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(student => {
                const score = parseFloat(student.engagementScore) || 0;
                const level = getScoreLevel(score);
                const levelLabel = getLevelLabel(level);
                const timeMin = Math.round((student.totalTimeSpent || 0) / 60);

                // Calculate performance by category
                const pageViews = student.totalPageViews || 0;
                const linkClicks = student.totalLinkClicks || 0;
                const lessonViews = student.totalLessonViews || 0;
                const quizAttempts = student.totalQuizAttempts || 0;
                const lessonsCompleted = student.totalLessonsCompleted || 0;
                const messagesSent = student.totalMessagesSent || 0;

                // Oral performance metrics (from external system - see Part 2)
                const oralSessions = student.oralSessions || 0;
                const oralFluency = student.oralFluency || 0;
                const oralPronunciation = student.oralPronunciation || 0;
                const oralComprehension = student.oralComprehension || 0;

                html += `
                    <div class="student-card">
                        <div class="header">
                            <span class="name">
                                <span class="status-dot online"></span>
                                ${student.name}
                            </span>
                            <span class="score ${level}">${score}% (${levelLabel})</span>
                        </div>

                        <div class="performance-grid">
                            <!-- Participation -->
                            <div class="performance-category">
                                <div class="cat-label"><i class="fas fa-eye"></i> Participation</div>
                                <div class="cat-value">${pageViews + linkClicks}</div>
                                <div class="cat-detail">${pageViews} views • ${linkClicks} clicks</div>
                                <div class="cat-bar"><div class="fill yellow" style="width:${Math.min((pageViews + linkClicks) / 2, 100)}%"></div></div>
                            </div>

                            <!-- Learning -->
                            <div class="performance-category">
                                <div class="cat-label"><i class="fas fa-book"></i> Learning</div>
                                <div class="cat-value">${lessonViews}</div>
                                <div class="cat-detail">${lessonsCompleted} completed</div>
                                <div class="cat-bar"><div class="fill cyan" style="width:${Math.min(lessonViews * 2, 100)}%"></div></div>
                            </div>

                            <!-- Assessment -->
                            <div class="performance-category">
                                <div class="cat-label"><i class="fas fa-brain"></i> Assessment</div>
                                <div class="cat-value">${quizAttempts}</div>
                                <div class="cat-detail">${student.quizPasses || 0} passed</div>
                                <div class="cat-bar"><div class="fill green" style="width:${Math.min(quizAttempts * 2, 100)}%"></div></div>
                            </div>

                            <!-- Communication -->
                            <div class="performance-category">
                                <div class="cat-label"><i class="fas fa-comment"></i> Communication</div>
                                <div class="cat-value">${messagesSent}</div>
                                <div class="cat-detail">Messages sent</div>
                                <div class="cat-bar"><div class="fill orange" style="width:${Math.min(messagesSent * 5, 100)}%"></div></div>
                            </div>
                        </div>

                        <!-- Oral Performance -->
                        <div class="oral-section">
                            <div class="oral-label"><i class="fas fa-microphone"></i> Oral Performance (40% of grade)</div>
                            <div class="oral-stats">
                                <span class="stat">Sessions: <span class="val">${oralSessions}</span></span>
                                <span class="stat">Fluency: <span class="val">${oralFluency}/10</span></span>
                                <span class="stat">Pronunciation: <span class="val">${oralPronunciation}/10</span></span>
                                <span class="stat">Comprehension: <span class="val">${oralComprehension}/10</span></span>
                                <span class="stat">Time: <span class="val">${timeMin}m</span></span>
                            </div>
                            <div style="display:flex; gap:8px; margin-top:6px;">
                                <button style="background:rgba(255,204,0,0.1); color:#ffcc00; border:1px solid rgba(255,204,0,0.3); padding:4px 12px; border-radius:20px; font-size:0.7rem; cursor:pointer;">
                                    <i class="fas fa-video"></i> Schedule Interview
                                </button>
                                <button style="background:rgba(0,255,255,0.1); color:#00ffff; border:1px solid rgba(0,255,255,0.3); padding:4px 12px; border-radius:20px; font-size:0.7rem; cursor:pointer;">
                                    <i class="fas fa-chart-bar"></i> View Transcript
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function loadTeacherName() {
            if (token) {
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    document.getElementById('teacherName').innerHTML = `<i class="fas fa-user-graduate"></i> ${payload.name || 'Teacher'}`;
                } catch (e) {}
            }
        }

        loadTeacherName();
        fetchStudents();
    </script>

</body>
</html>
