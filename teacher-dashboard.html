<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeSpellBee - Teacher Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* ====== TOP NAV ====== */
        .nav-bar {
            background: #0d0d0d;
            border-bottom: 1px solid #1a4a4a;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .nav-bar .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
        }
        .nav-bar .logo span {
            color: #fff;
        }
        .nav-bar .teacher-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .nav-bar .teacher-info .name {
            font-weight: 600;
            color: #fff;
        }
        .nav-bar .teacher-info .badge {
            background: rgba(0, 255, 255, 0.15);
            color: #00ffff;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
        .nav-bar .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* ====== DASHBOARD LAYOUT ====== */
        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 32px 60px;
        }

        /* ====== STATS ROW ====== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #0d0d0d;
            border: 1px solid #1a4a4a;
            border-radius: 14px;
            padding: 20px 24px;
            transition: border-color 0.3s;
        }
        .stat-card:hover {
            border-color: #00ffff;
        }
        .stat-card .label {
            color: #88dddd;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .stat-card .number {
            font-size: 2.4rem;
            font-weight: 700;
            color: #fff;
            margin: 4px 0 2px;
        }
        .stat-card .number .highlight {
            color: #00ffff;
        }
        .stat-card .sub {
            color: #666;
            font-size: 0.8rem;
        }
        .stat-card .sub i {
            margin-right: 4px;
        }

        /* ====== TWO-COLUMN GRID ====== */
        .two-col {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        /* ====== ACTIVITY FEED ====== */
        .panel {
            background: #0d0d0d;
            border: 1px solid #1a4a4a;
            border-radius: 14px;
            padding: 20px 24px;
        }
        .panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .panel .panel-header h3 {
            color: #00ffff;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel .panel-header .count-badge {
            background: rgba(0, 255, 255, 0.12);
            color: #00ffff;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .panel .panel-header .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 1.5s infinite;
        }
        .panel .panel-header .live-dot.active {
            background: #00ff88;
        }

        /* ====== ACTIVITY ITEMS ====== */
        .activity-list {
            max-height: 420px;
            overflow-y: auto;
        }
        .activity-list::-webkit-scrollbar {
            width: 4px;
        }
        .activity-list::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 4px;
        }
        .activity-list::-webkit-scrollbar-thumb {
            background: #00ffff;
            border-radius: 4px;
        }

        .activity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1a1a1a;
            animation: slideIn 0.4s ease;
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .activity-item .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .activity-item .left .icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .activity-item .left .icon.click { background: rgba(0, 255, 255, 0.12); color: #00ffff; }
        .activity-item .left .icon.view { background: rgba(255, 204, 0, 0.12); color: #ffcc00; }
        .activity-item .left .icon.book { background: rgba(0, 255, 136, 0.12); color: #00ff88; }
        .activity-item .left .icon.search { background: rgba(255, 102, 170, 0.12); color: #ff66aa; }

        .activity-item .left .text {
            font-size: 0.9rem;
        }
        .activity-item .left .text .student {
            color: #fff;
            font-weight: 600;
        }
        .activity-item .left .text .action {
            color: #88dddd;
        }
        .activity-item .left .text .target {
            color: #00ffff;
            font-weight: 500;
        }

        .activity-item .time {
            color: #555;
            font-size: 0.7rem;
            white-space: nowrap;
            margin-left: 12px;
        }

        /* ====== ONLINE STUDENTS ====== */
        .online-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .online-student {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #121212;
            border-radius: 10px;
            border-left: 3px solid #00ff88;
        }
        .online-student .name {
            font-weight: 500;
            color: #fff;
        }
        .online-student .name i {
            color: #00ff88;
            font-size: 0.6rem;
            margin-right: 6px;
        }
        .online-student .detail {
            color: #666;
            font-size: 0.75rem;
        }
        .online-student .detail .highlight {
            color: #00ffff;
        }

        /* ====== UPCOMING SESSIONS ====== */
        .session-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .session-item:last-child {
            border-bottom: none;
        }
        .session-item .left .student-name {
            color: #fff;
            font-weight: 500;
        }
        .session-item .left .subject {
            color: #88dddd;
            font-size: 0.8rem;
        }
        .session-item .time-slot {
            color: #00ffff;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* ====== EMPTY STATE ====== */
        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: #555;
        }
        .empty-state i {
            font-size: 2rem;
            color: #333;
            margin-bottom: 12px;
            display: block;
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 768px) {
            .two-col {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .nav-bar {
                padding: 12px 16px;
            }
            .dashboard {
                padding: 16px;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .activity-item {
                flex-wrap: wrap;
                gap: 4px;
            }
            .activity-item .time {
                margin-left: 44px;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <!-- ====== TOP NAV ====== -->
    <nav class="nav-bar">
        <div class="logo">
            <svg width="180" height="40" viewBox="0 0 200 50">
                <defs>
                    <linearGradient id="dashboardGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:aqua;"/>
                        <stop offset="50%" style="stop-color:white;" />
                        <stop offset="100%" style="stop-color:yellow;" />
                    </linearGradient>
                </defs>
                <text x="0" y="38" fill="url(#dashboardGradient)" font-size="36" font-weight="700" font-family="Segoe UI, sans-serif">BeSpellBee</text>
            </svg>
        </div>
        <div class="teacher-info">
            <span class="badge"><span class="status-dot"></span> Live</span>
            <!-- IDs added here so JS can inject the real name -->
            <span class="name" id="navTeacherName"><i class="fas fa-user-graduate"></i> Loading...</span>
            <span style="color: #555; font-size: 0.8rem;" id="navTeacherSubject">| ...</span>
            <!-- Logout button made functional -->
            <a href="#" id="logoutBtn" style="color: #00ffff; text-decoration: none; font-size: 0.85rem; border-left: 1px solid #333; padding-left: 16px;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </nav>

    <!-- ====== DASHBOARD ====== -->
    <div class="dashboard">

        <!-- ====== STATS ====== -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label"><i class="fas fa-users"></i> Total Students</div>
                <div class="number" id="activeStudents">0</div>
                <div class="sub">Tracked this period</div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-calendar-check"></i> Total Bookings</div>
                <div class="number" id="todaySessions">0</div>
                <div class="sub"><i class="fas fa-clock"></i> <span id="nextSession">All time</span></div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-eye"></i> Recorded Activity</div>
                <div class="number" id="profileViews">0</div>
                <div class="sub">Page views & clicks</div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-clock"></i> Pending Requests</div>
                <div class="number" id="totalClicks">0</div>
                <div class="sub">Awaiting confirmation</div>
            </div>
        </div>

        <!-- ====== TWO COLUMNS ====== -->
        <div class="two-col">

            <!-- LEFT: ACTIVITY FEED -->
            <div class="panel">
                <div class="panel-header">
                    <h3>
                        <span class="live-dot active"></span> Live Activity
                        <span class="count-badge" id="activityCount">0</span>
                    </h3>
                    <span style="color:#555; font-size:0.75rem;">
                        <i class="fas fa-sync-alt fa-spin"></i> live
                    </span>
                </div>
                <div class="activity-list" id="activityFeed">
                    <div class="empty-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading real-time data...</p>
                    </div>
                </div>
            </div>

            <!-- RIGHT: ONLINE STUDENTS + UPCOMING -->
            <div style="display: flex; flex-direction: column; gap: 24px;">

                <!-- ONLINE STUDENTS / ENGAGED STUDENTS -->
                <div class="panel">
                    <div class="panel-header">
                        <h3><i class="fas fa-circle" style="color:#00ff88; font-size:0.6rem;"></i> Top Engaged</h3>
                        <span class="count-badge" id="onlineCount">0</span>
                    </div>
                    <div class="online-grid" id="onlineStudents">
                        <div class="empty-state" style="padding:16px;"><p style="font-size:0.85rem;">Loading...</p></div>
                    </div>
                </div>

                <!-- UPCOMING SESSIONS / BOOKINGS -->
                <div class="panel">
                    <div class="panel-header">
                        <h3><i class="fas fa-calendar-alt"></i> Recent Bookings</h3>
                        <span class="count-badge" id="upcomingCount">0</span>
                    </div>
                    <div id="upcomingSessions">
                        <div class="empty-state" style="padding:16px;"><p style="font-size:0.85rem;">Loading...</p></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ====== REAL DASHBOARD JAVASCRIPT ====== -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        
        // ⚠️ REPLACE THIS with your actual Render URL (e.g., https://my-app.onrender.com)
       const API_BASE_URL = 'https://bespellbee-backend-en6l.onrender.com';
        // ============================================================
        // LOGOUT LOGIC
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('authToken');
            localStorage.removeItem('teacherId');
            localStorage.removeItem('teacherName');
            localStorage.removeItem('userRole');
            window.location.href = 'index.html'; // Change if your login file has a different name
        });

        // ============================================================
        // HELPER: FORMAT TIME AGO
        // ============================================================
        function timeAgo(dateString) {
            const now = new Date();
            const past = new Date(dateString);
            const diffMs = now - past;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHrs = Math.floor(diffMs / 3600000);
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHrs < 24) return `${diffHrs}h ago`;
            return past.toLocaleDateString();
        }

        // ============================================================
        // FETCH REAL DATA
        // ============================================================
        async function loadDashboard() {
           const token = localStorage.getItem('authToken'); // Match what index.html saves! // Make sure your login page saves the token here!

            if (!token) {
                alert('Please log in to view the dashboard.');
                window.location.href = 'index.html';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/teacher/dashboard`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.message || 'Failed to fetch dashboard data');
                }

                // Pass data to render functions
                renderDashboard(result.data);

            } catch (error) {
                console.error('Dashboard Load Error:', error);
                alert('Session expired or error loading data. Please log in again.');
                window.location.href = 'index.html';
            }
        }

        // ============================================================
        // RENDER FUNCTIONS
        // ============================================================
        function renderDashboard(data) {
            const { teacher, stats, recentActivity, engagementStats, bookings } = data;

            // 1. Update Top Nav
            document.getElementById('navTeacherName').innerHTML = `<i class="fas fa-user-graduate"></i> ${teacher.name}`;
            document.getElementById('navTeacherSubject').textContent = `| ${teacher.subject || 'Teacher'}`;

            // 2. Update Stats Cards
            document.getElementById('activeStudents').textContent = stats.totalStudents || 0;
            document.getElementById('todaySessions').textContent = stats.totalBookings || 0;
            document.getElementById('profileViews').textContent = stats.recentActivityCount || 0;
            document.getElementById('totalClicks').textContent = stats.pendingBookings || 0;

            // 3. Render Live Activity Feed
            renderActivityFeed(recentActivity || []);

            // 4. Render Top Engaged Students (Using engagementStats)
            renderEngagedStudents(engagementStats || []);

            // 5. Render Bookings
            renderBookings(bookings || []);
        }

        function renderActivityFeed(activities) {
            const container = document.getElementById('activityFeed');
            const count = document.getElementById('activityCount');

            if (activities.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>No activity recorded yet</p></div>`;
                count.textContent = '0';
                return;
            }

            count.textContent = activities.length;
            
            container.innerHTML = activities.map(item => {
                // Parse activity data safely
                let details = item.activityData;
                if (typeof details === 'string') {
                    try { details = JSON.parse(details); } catch(e) { details = {}; }
                }

                // Determine icon and text based on type
                let iconClass = 'view';
                let emoji = '👁️';
                let actionText = 'viewed';
                let targetText = details.page || 'Page';

                if (item.activityType === 'link_click') {
                    iconClass = 'click'; emoji = '🔗'; actionText = 'clicked'; targetText = details.link || 'Link';
                } else if (item.activityType === 'carousel_view') {
                    iconClass = 'search'; emoji = '🔄'; actionText = 'viewed carousel on'; targetText = details.page || 'Home';
                }

                // If a student is attached, show their name. Otherwise show "Visitor"
                const studentName = item.Student ? item.Student.name : 'Anonymous Visitor';

                return `
                    <div class="activity-item">
                        <div class="left">
                            <div class="icon ${iconClass}">${emoji}</div>
                            <div class="text">
                                <span class="student">${studentName}</span>
                                <span class="action"> ${actionText} </span>
                                <span class="target">${targetText}</span>
                            </div>
                        </div>
                        <span class="time">${timeAgo(item.createdAt)}</span>
                    </div>
                `;
            }).join('');
        }

        function renderEngagedStudents(students) {
            const container = document.getElementById('onlineStudents');
            const count = document.getElementById('onlineCount');

            if (students.length === 0) {
                container.innerHTML = `<div class="empty-state" style="padding:16px;"><p style="font-size:0.85rem;">No student data yet</p></div>`;
                count.textContent = '0';
                return;
            }

            count.textContent = students.length;

            container.innerHTML = students.map(s => {
                // The backend sends student data inside a Student object
                const studentData = s.Student || s;
                const name = studentData.name || 'Unknown Student';
                const actions = s.activityCount || 0;
                
                return `
                    <div class="online-student">
                        <span class="name"><i class="fas fa-circle"></i> ${name}</span>
                        <span class="detail"><span class="highlight">${actions}</span> actions</span>
                    </div>
                `;
            }).join('');
        }

        function renderBookings(bookings) {
            const container = document.getElementById('upcomingSessions');
            const count = document.getElementById('upcomingCount');

            if (bookings.length === 0) {
                container.innerHTML = `<div class="empty-state" style="padding:16px;"><p style="font-size:0.85rem;">No bookings yet</p></div>`;
                count.textContent = '0';
                return;
            }

            count.textContent = bookings.length;

            container.innerHTML = bookings.map(b => {
                const statusColor = b.status === 'pending' ? '#ffcc00' : '#00ff88';
                return `
                    <div class="session-item">
                        <div class="left">
                            <div class="student-name">${b.studentName || 'Student'}</div>
                            <div class="subject" style="color: ${statusColor}; text-transform:capitalize;">${b.status || 'Pending'}</div>
                        </div>
                        <div class="time-slot">${timeAgo(b.createdAt)}</div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // INIT ON LOAD
        // ============================================================
        window.onload = loadDashboard;

    </script>
        <!-- ============================================================ -->
    <!-- WEBSOCKET REAL-TIME CONNECTION -->
    <!-- ============================================================ -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const token = localStorage.getItem('authToken');

        if (token) {
            const socket = io('https://bespellbee-backend-en6l.onrender.com', {
                auth: { token: token },
                transports: ['websocket']
            });

            socket.on('connect', () => {
                console.log('✅ WebSocket connected');
            });

            socket.on('new-activity', (activity) => {
                console.log('📡 Live activity received:', activity);
                // Call your existing function that adds activity to the feed
                if (typeof addActivityToFeed === 'function') {
                    addActivityToFeed(activity);
                }
            });

            socket.on('disconnect', () => {
                console.log('❌ WebSocket disconnected');
            });

            socket.on('connect_error', (err) => {
                console.warn('⚠️ WebSocket connection error:', err.message);
            });
        } else {
            console.warn('🔒 No token – WebSocket not connected');
        }
    </script>
</body>
</html>

</body>
