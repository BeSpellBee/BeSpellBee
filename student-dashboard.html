<script>
// ============================================================
// CONFIGURATION
// ============================================================
const API_BASE_URL = 'https://bespellbee-backend-en6l.onrender.com';
let currentCourse = null;
let currentCourseData = null;
let courses = [];
let currentPage = 'dashboard';
let pageViewTracked = false;

// Messaging state
let currentContact = null;
let contacts = [];
let messages = [];

// Discussion state
let topics = [];
let currentTopicId = null;

// ============================================================
// TOAST SYSTEM
// ============================================================
let toastTimer = null;
function showToast(message, type = 'info') {
    const el = document.getElementById('toast');
    const msg = document.getElementById('toastMsg');
    msg.textContent = message;
    el.className = 'toast ' + type;
    clearTimeout(toastTimer);
    void el.offsetWidth;
    el.classList.add('show');
    toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
}

// ============================================================
// TRACKING HELPER
// ============================================================
async function trackActivity(endpoint, data) {
    const token = localStorage.getItem('authToken');
    if (!token) return;
    try {
        await fetch(`${API_BASE_URL}/api/track/${endpoint}`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
    } catch(e) { console.warn('Tracking failed:', e); }
}

// ============================================================
// API CALLS
// ============================================================
async function fetchAllCourses() {
    const token = localStorage.getItem('authToken');
    if (!token) return [];
    try {
        const res = await fetch(`${API_BASE_URL}/api/student/courses`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        return data.success ? (data.data || data.courses || []) : [];
    } catch(e) { return []; }
}

async function fetchCourse(courseId) {
    try {
        const res = await fetch(`${API_BASE_URL}/api/student/courses/${courseId}`, {
            headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
        });
        const data = await res.json();
        if (data.success) {
            const course = data.data;
            course.modules = course.Modules || course.modules || [];
            course.modules.forEach(mod => {
                mod.Lessons = mod.Lessons || mod.lessons || [];
                mod.Lessons.forEach(lesson => {
                    lesson.questions = lesson.Questions || lesson.questions || [];
                    lesson.content = lesson.Content || lesson.content || '';
                    lesson.title = lesson.Title || lesson.title || 'Untitled';
                    lesson.type = lesson.type || 'lesson';
                });
            });
            return course;
        }
        return null;
    } catch(e) { return null; }
}

// ============================================================
// STATE HELPERS
// ============================================================
function getProgress(courseId) {
    const saved = localStorage.getItem(`lmsProgress_${courseId}`);
    return saved ? JSON.parse(saved) : {};
}
function saveProgress(courseId, prog) {
    localStorage.setItem(`lmsProgress_${courseId}`, JSON.stringify(prog));
}
function isCompleted(courseId, lessonId) {
    const prog = getProgress(courseId);
    return prog[lessonId] && prog[lessonId].completed === true;
}
function markCompleted(courseId, lessonId) {
    const prog = getProgress(courseId);
    prog[lessonId] = { completed: true };
    saveProgress(courseId, prog);
}

// ============================================================
// PAGE VIEW TRACKING
// ============================================================
function trackPageView(page) {
    if (pageViewTracked) return;
    pageViewTracked = true;
    currentPage = page || 'dashboard';
    trackActivity('page-view', { page: currentPage, url: window.location.href, duration: 0, action: 'view' });
}

// ============================================================
// COURSE SELECTOR
// ============================================================
function renderCourseSelector() {
    const container = document.getElementById('courseSelector');
    if (!courses || courses.length === 0) {
        container.innerHTML = `<p style="color:#888;">No courses available.</p>`;
        return;
    }
    let html = '';
    courses.forEach(course => {
        const active = course.id === currentCourse ? 'active' : '';
        html += `<button class="course-btn ${active}" data-course-id="${course.id}" onclick="selectCourse(${course.id})">${course.icon || '📚'} ${course.title}</button>`;
    });
    container.innerHTML = html;
}

async function selectCourse(courseId) {
    currentCourse = courseId;
    document.querySelectorAll('.course-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.courseId) === courseId);
    });
    const courseData = await fetchCourse(courseId);
    if (courseData) {
        currentCourseData = courseData;
        document.getElementById('courseTitle').textContent = courseData.title;
        const isUnlocked = localStorage.getItem(`lmsUnlocked_${courseId}`) === 'true';
        if (isUnlocked) {
            document.getElementById('lmsGate').style.display = 'none';
            document.getElementById('lmsViews').style.display = 'block';
            renderDashboard(courseId);
            trackPageView('dashboard');
            loadContacts(); // load messaging contacts
            loadTopics();   // load discussion topics
        } else {
            document.getElementById('lmsGate').style.display = 'block';
            document.getElementById('lmsViews').style.display = 'none';
            document.getElementById('lmsPassword').value = '';
            document.getElementById('lmsGateError').textContent = '';
        }
    } else {
        currentCourseData = null;
        document.getElementById('courseTitle').textContent = 'Error loading course';
        document.getElementById('dashboardContent').innerHTML = `<p style="color:#ff4444;">Failed to load course.</p>`;
    }
}

function unlockLMS() {
    const input = document.getElementById('lmsPassword');
    const error = document.getElementById('lmsGateError');
    if (!currentCourseData) { error.innerText = 'Select a course first.'; return; }
    if (input.value.trim() === currentCourseData.accessCode) {
        localStorage.setItem(`lmsUnlocked_${currentCourse}`, 'true');
        document.getElementById('lmsGate').style.display = 'none';
        document.getElementById('lmsViews').style.display = 'block';
        renderDashboard(currentCourse);
        trackPageView('dashboard');
        loadContacts();
        loadTopics();
        showToast('Course unlocked!', 'success');
    } else {
        error.innerText = 'Incorrect access code.';
        input.value = '';
        input.focus();
    }
}
document.getElementById('lmsPassword').addEventListener('keypress', (e) => { if (e.key === 'Enter') unlockLMS(); });

function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
    if (tab === 'messages') loadContacts();
    if (tab === 'discussion') loadTopics();
}

// ============================================================
// FETCH ENGAGEMENT STATS (FIXED – uses /api/track/dashboard)
// ============================================================
async function fetchEngagementStats() {
    const token = localStorage.getItem('authToken');
    if (!token) return null;
    try {
        const res = await fetch(`${API_BASE_URL}/api/track/dashboard`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.success) {
            const d = data.data;
            return {
                name: d.student?.name || 'Student',
                engagementScore: d.student?.engagementScore || 0,
                // totalCompleted counts all completions (lessons + practice + quizzes passed)
                lessonsCompleted: d.stats?.totalCompleted || 0,
                videosCompleted: d.stats?.totalVideoCompleted || 0,
                messagesSent: d.stats?.totalMessages || 0,
                quizzesPassed: d.stats?.totalQuizPasses || 0
            };
        }
        return null;
    } catch(e) {
        console.error('Error fetching engagement stats:', e);
        return null;
    }
}

// ============================================================
// RENDER DASHBOARD
// ============================================================
function renderDashboard(courseId) {
    const course = currentCourseData;
    const container = document.getElementById('dashboardContent');
    const prog = getProgress(courseId);
    let totalLessons = 0, completedLessons = 0;
    if (course && course.modules) {
        course.modules.forEach(mod => {
            if (mod.Lessons) {
                mod.Lessons.forEach(lesson => {
                    totalLessons++;
                    if (prog[lesson.id] && prog[lesson.id].completed) completedLessons++;
                });
            }
        });
    }
    const overallProgress = totalLessons > 0 ? Math.round((completedLessons / totalLessons) * 100) : 0;

    // Fetch engagement stats
    fetchEngagementStats().then(stats => {
        let engagementScore = 0, lessonsCompleted = 0, videosCompleted = 0, messagesSent = 0, quizzesPassed = 0;
        let studentName = 'Student';
        if (stats) {
            studentName = stats.name || 'Student';
            engagementScore = stats.engagementScore || 0;
            lessonsCompleted = stats.lessonsCompleted || 0;
            videosCompleted = stats.videosCompleted || 0;
            messagesSent = stats.messagesSent || 0;
            quizzesPassed = stats.quizzesPassed || 0;
        }

        let html = `
            <div class="engagement-card">
                <div class="flex-row">
                    <div>
                        <span style="color:#88dddd; font-size:0.85rem; display:block;">⭐ ${studentName}'s Engagement Score</span>
                        <span class="score">${Math.round(engagementScore)}%</span>
                    </div>
                    <div>
                        <div class="stats">
                            <span>📘 ${lessonsCompleted} completions</span>
                            <span>•</span>
                            <span>🎬 ${videosCompleted} videos</span>
                            <span>•</span>
                            <span>💬 ${messagesSent} messages</span>
                            <span>•</span>
                            <span>🏆 ${quizzesPassed} quizzes passed</span>
                        </div>
                        <span style="color:#555; font-size:0.7rem; display:block; margin-top:4px;">${getMotivationalMessage(engagementScore)}</span>
                    </div>
                </div>
                <div class="engagement-bar">
                    <div class="fill" style="width:${Math.min(engagementScore,100)}%;"></div>
                </div>
            </div>
        `;

        if (course && course.modules && course.modules.length > 0) {
            html += `
                <div class="dashboard-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px;">
                    <h2 style="color:#00ffff; border-left:6px solid #ffcc00; padding-left:16px; margin:0; font-size:1.4rem;"><i class="fas fa-list-ul"></i> ${course.icon || '📚'} ${course.title}</h2>
                </div>
                <div style="background:#121212; border-radius:16px; padding:16px 20px; margin-bottom:20px; border:1px solid #1a4a4a;">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                        <span style="color:#88dddd;"><i class="fas fa-chart-line"></i> Overall Progress</span>
                        <span style="color:#00ffff; font-weight:700;">${overallProgress}% (${completedLessons}/${totalLessons})</span>
                    </div>
                    <div style="width:100%; height:6px; background:#1a1a1a; border-radius:4px; margin-top:8px; overflow:hidden;">
                        <div style="height:100%; background:linear-gradient(90deg, #00ffff, #ffcc00); border-radius:4px; width:${overallProgress}%; transition:width 0.5s;"></div>
                    </div>
                </div>
                <div id="moduleList"></div>
            `;
        } else {
            html += `<div style="text-align:center;padding:40px 20px;background:#121212;border-radius:16px;border:1px solid #1a4a4a;margin-top:10px;"><i class="fas fa-info-circle" style="font-size:2.5rem;color:#555;display:block;margin-bottom:15px;"></i><h3 style="color:#88dddd;">No content yet</h3><p style="color:#666;">This course has no modules or lessons.</p></div>`;
        }
        container.innerHTML = html;

        if (course && course.modules && course.modules.length > 0) {
            const moduleList = document.getElementById('moduleList');
            let listHtml = '';
            course.modules.forEach(mod => {
                listHtml += `<div class="module-card" style="background:#121212;border-radius:24px;padding:20px;margin-bottom:20px;border-left:6px solid #ffcc00;border:1px solid #1a4a4a;"><h3 style="color:#00ffff;margin-top:0;font-size:1.1rem;"><i class="fas fa-folder-open"></i> ${mod.title}</h3>`;
                if (mod.Lessons && mod.Lessons.length > 0) {
                    mod.Lessons.forEach(lesson => {
                        const done = isCompleted(courseId, lesson.id) ? 'done' : '';
                        let label = isCompleted(courseId, lesson.id) ? '✅ Completed' : (lesson.type === 'quiz' ? '🧠 Quiz' : '📖 Lesson');
                        if (lesson.type === 'quiz') {
                            const data = prog[lesson.id];
                            if (data && data.completed) label = `✅ Completed (${data.score||0}/${data.total||0})`;
                        }
                        const icon = lesson.type === 'quiz' ? '🧠' : '📖';
                        listHtml += `<div class="lesson-item" style="display:flex;justify-content:space-between;align-items:center;background:#1a1a1a;padding:12px 18px;border-radius:16px;border:1px solid #1a4a4a;margin:8px 0;cursor:pointer;transition:all 0.3s;" onclick="openLesson('${courseId}','${mod.id}','${lesson.id}')">
                            <span>${icon} ${lesson.title}</span>
                            <span class="status ${done}" style="font-size:0.8rem;padding:4px 12px;border-radius:40px;background:#1a1a1a;color:#666;border:1px solid #1a4a4a;">${label}</span>
                        </div>`;
                    });
                } else {
                    listHtml += `<p style="color:#555;font-size:0.85rem;padding:8px 0;">No lessons yet.</p>`;
                }
                listHtml += `</div>`;
            });
            moduleList.innerHTML = listHtml;
        }
    }).catch(err => {
        console.error(err);
        container.innerHTML = `<div style="color:#ff6666;text-align:center;padding:20px;"><i class="fas fa-exclamation-triangle" style="font-size:2rem;display:block;margin-bottom:10px;"></i>Error loading dashboard.</div>`;
    });
}

// ============================================================
// MOTIVATIONAL MESSAGE
// ============================================================
function getMotivationalMessage(score) {
    const s = Math.round(score);
    if (s >= 80) return '🌟 Outstanding! You\'re a learning superstar!';
    if (s >= 60) return '🔥 Great progress! Keep up the momentum!';
    if (s >= 40) return '📈 You\'re on the right track! Keep exploring!';
    if (s >= 20) return '💪 Every click counts! Continue learning!';
    return '🌱 Start your learning journey today!';
}

document.getElementById('logoutBtn').addEventListener('click', function(e) {
    e.preventDefault();
    localStorage.removeItem('authToken');
    localStorage.removeItem('studentId');
    localStorage.removeItem('studentName');
    localStorage.removeItem('userRole');
    window.location.href = 'index.html';
});

function loadStudentName() {
    const token = localStorage.getItem('authToken');
    if (token) {
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            const name = payload.name || 'Student';
            document.getElementById('navStudentName').innerHTML = `<i class="fas fa-user-graduate"></i> ${name}`;
        } catch(e) {
            document.getElementById('navStudentName').innerHTML = `<i class="fas fa-user-graduate"></i> Student`;
        }
    } else {
        document.getElementById('navStudentName').innerHTML = `<i class="fas fa-user-graduate"></i> Guest`;
    }
}

document.addEventListener('click', function(e) {
    const link = e.target.closest('a');
    if (link && link.href && link.href.startsWith('http')) {
        const onclickAttr = link.getAttribute('onclick');
        if (onclickAttr && onclickAttr.includes('trackLink')) return;
        trackActivity('link-click', { link: link.href, page: currentPage || 'dashboard', url: window.location.href });
    }
});

window.trackLink = function(linkName) {
    const token = localStorage.getItem('authToken');
    if (!token) return;
    trackActivity('link-click', { link: linkName, page: currentPage || 'dashboard', url: window.location.href });
};
